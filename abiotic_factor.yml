- name: Setup Abiotic Factor game server
  hosts: Winston
  vars:
    lxc_vmid: 405
    lxc_hostname: "Abiotic-Server"
    lxc_ip: "10.69.1.41"
    lxc_cidr: "24"
    lxc_gateway: "10.69.1.1"
    MaxServerPlayers: 6
    ServerName: "Abiotic"
    SaveName: "Abiotic"
    AbioticServerPort: 7777
    AbioticQueryPort: 27015
    abiotic_user: abiotic
    abiotic_home: /home/abiotic
    abiotic_install_dir: /home/abiotic/abioticserver
    abiotic_wine_prefix: /home/abiotic/.wine
    abiotic_app_id: 2857200
    abiotic_installer_host_path: /tmp/abiotic_install_server.sh
    abiotic_installer_lxc_path: /root/abiotic_install_server.sh

  roles:
    - role: proxmox_lxc
      vars:
        lxc_memory: 8192
        lxc_cores: 4
        lxc_netif: "{'net0': 'name=eth0,bridge=vmbr0,ip={{ lxc_ip }}/{{ lxc_cidr }},gw={{ lxc_gateway }}'}"
        lxc_tags: "gameserver"
        lxc_disk: 'local-lvm:30'
        lxc_template: "local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst"
        lxc_state: present

    - role: proxmox_lxc
      vars:
        lxc_memory: 8192
        lxc_cores: 4
        lxc_netif: "{'net0': 'name=eth0,bridge=vmbr0,ip={{ lxc_ip }}/{{ lxc_cidr }},gw={{ lxc_gateway }}'}"
        lxc_tags: "gameserver"
        lxc_disk: 'local-lvm:30'
        lxc_template: "local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst"
        lxc_state: started

  tasks:
    - name: Check container status
      ansible.builtin.command:
        cmd: "pct status {{ lxc_vmid }}"
      register: container_status
      changed_when: false

    - name: Debug container status
      ansible.builtin.debug:
        var: container_status.stdout

    - name: Render Abiotic Factor installer script on Proxmox host
      ansible.builtin.template:
        src: "{{ playbook_dir }}/mytemplates/abiotic_install_server.sh.j2"
        dest: "{{ abiotic_installer_host_path }}"
        mode: '0755'

    - name: Push installer script into LXC
      ansible.builtin.command:
        cmd: "pct push {{ lxc_vmid }} {{ abiotic_installer_host_path }} {{ abiotic_installer_lxc_path }} --perms 0755"

    - name: Run installer script inside LXC
      ansible.builtin.command:
        cmd: "pct exec {{ lxc_vmid }} -- bash {{ abiotic_installer_lxc_path }}"
      register: setup_result

    - name: Show installer output
      ansible.builtin.debug:
        var: setup_result.stdout_lines

    - name: Clean up installer script on Proxmox host
      ansible.builtin.file:
        path: "{{ abiotic_installer_host_path }}"
        state: absent
